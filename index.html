<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simms Newell - Cybersecurity Professional</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --btn-bg: #161b22;
            --btn-hover: #21262d;
            --accent-blue: #58a6ff;
            --border-color: #30363d;
        }

        /* Standard document background fallback setup */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* Hard locks the profile layout block directly in the center of the monitor */
        .container {
            max-width: 400px;
            width: 100%;
            margin: 0 auto !important; /* Forces horizontal centering on desktop screens */
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }

        .avatar-container {
            margin-bottom: 24px;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .security-icon {
            width: 110px;
            height: 110px;
            border: 1px solid var(--border-color);
            padding: 8px;
            border-radius: 50%;
            background-color: #11151c;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0 0 8px 0;
            color: #ffffff;
            font-weight: 600;
            width: 100%;
            text-align: center;
        }

        p {
            font-size: 1rem;
            color: #8b949e;
            margin: 0 0 35px 0;
            width: 100%;
            text-align: center;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 320px; /* Restricts button grouping space expansion */
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 16px 24px;
            text-decoration: none;
            color: #ffffff;
            background-color: var(--btn-bg);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.2s ease-in-out;
            box-sizing: border-box;
            width: 100%;
        }

        .btn:hover {
            background-color: var(--btn-hover);
            border-color: var(--accent-blue);
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.2);
        }

        .btn-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .btn-text {
            flex-grow: 1;
            text-align: left;
            margin-left: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- High-Detail Matrix Cybersecurity Shield Logo -->
        <div class="avatar-container">
            <svg class="security-icon" viewBox="0 0 100 100" xmlns="http://w3.org">
                <!-- Left Side Background (Dark Terminal Tint) -->
                <path d="M50,5 L15,20 L15,50 C15,75 50,95 50,95" fill="#06090e" stroke="#22c55e" stroke-width="2"/>
                
                <!-- Multi-column Matrix Falling Code Grid Texture -->
                <g font-family="monospace" font-size="7" font-weight="bold" letter-spacing="1">
                    <!-- Column 1 -->
                    <text x="18" y="28" fill="#15803d">0</text>
                    <text x="18" y="36" fill="#22c55e">1</text>
                    <text x="18" y="44" fill="#4ade80">0</text>
                    <text x="18" y="52" fill="#166534">1</text>
                    <!-- Column 2 -->
                    <text x="28" y="24" fill="#22c55e">1</text>
                    <text x="28" y="32" fill="#86efac">0</text>
                    <text x="28" y="40" fill="#15803d">1</text>
                    <text x="28" y="48" fill="#22c55e">1</text>
                    <text x="28" y="56" fill="#166534">0</text>
                    <text x="28" y="64" fill="#14532d">1</text>
                    <!-- Column 3 -->
                    <text x="38" y="20" fill="#166534">0</text>
                    <text x="38" y="28" fill="#22c55e">1</text>
                    <text x="38" y="36" fill="#4ade80">1</text>
                    <text x="38" y="44" fill="#86efac">0</text>
                    <text x="38" y="52" fill="#22c55e">1</text>
                    <text x="38" y="60" fill="#15803d">0</text>
                    <text x="38" y="68" fill="#166534">1</text>
                    <text x="38" y="76" fill="#14532d">0</text>
                </g>

                <!-- Right Side (Metallic Tactical Dark Steel Shield Area) -->
                <path d="M50,5 L85,20 L85,50 C85,75 50,95 50,95" fill="#2d333b" stroke="#768390" stroke-width="2"/>
                <path d="M50,11 L77,23 L77,48 C77,68 50,85 50,85" fill="#1c2128"/>
            </svg>
        </div>

        <!-- Professional Details Header Block -->
        <h1>Simms Newell</h1>
        <p>Cybersecurity Professional</p>

        <!-- Vertical Interactive Profile Navigation Core -->
        <div class="links-container">
            <!-- LinkedIn Button Link Out Setup -->
            <a class="btn" href="https://linkedin.com/in/d-simms-newell" target="_blank" rel="noopener noreferrer">
                <svg class="btn-icon" viewBox="0 0 24 24" xmlns="http://w3.org">
                    <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0z"/>
                </svg>
                <span class="btn-text">Connect on LinkedIn</span>
            </a>
            
            <!-- GitHub Button Link Out Setup -->
            <a class="btn" href="https://github.com/snewell-cybersec" target="_blank" rel="noopener noreferrer">
                <svg class="btn-icon" viewBox="0 0 24 24" xmlns="http://w3.org">
                    <path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
                </svg>
                <span class="btn-text">View GitHub Projects</span>
            </a>
        </div>
    </div>

</body>
</html>
